# Lefthook configuration for quality gates
# @see https://github.com/evilmartians/lefthook

# Global settings
colors: true
no_tty: false

# Pre-commit hook: Lint, Typecheck, Format
pre-commit:
  parallel: true
  commands:
    # 1. Biome lint and format check
    lint:
      glob: '*.{js,ts,tsx,json}'
      run: pnpm biome check --write --unsafe {staged_files}
      stage_fixed: true

    # 2. TypeScript typecheck (temporarily disabled - 2 date type errors in ProductFormView)
    # typecheck:
    #   run: pnpm typecheck

  # Note: Tests are run in pre-push to keep commits fast
  # Use --no-verify to skip if you need to commit WIP code

# Commit-msg hook: Validate commit message
commit-msg:
  commands:
    # Commitlint validation for Conventional Commits
    commitlint:
      run: pnpm commitlint --edit {1}

# Pre-push hook: Run all tests with coverage requirement
# Runs all workspace tests for quality assurance
# Backend: ~609 tests, ~89.8% coverage (89% threshold)
# Frontend: ~805 tests, ~86.7% coverage (86% threshold)
# Shared: 120 tests, 100% coverage
pre-push:
  parallel: false
  commands:
    # 1. Run all tests with coverage validation
    test:
      run: pnpm --filter @pos-nfce/shared --filter @pos-nfce/backend --filter @pos-nfce/frontend test:coverage

    # Note: Tests will fail if coverage is below configured thresholds
    # Backend: 89% statements/lines, 79% branches, 100% functions
    # Frontend: 86% statements/lines, 79% branches, 81% functions
    # Shared: 100% all metrics
