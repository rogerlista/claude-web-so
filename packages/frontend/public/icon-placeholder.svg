<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#3B82F6"/>

  <!-- POS Icon - representing a point of sale terminal -->
  <g transform="translate(128, 128)">
    <!-- Screen/Monitor -->
    <rect x="32" y="16" width="192" height="144" rx="8" fill="#ffffff"/>
    <rect x="48" y="32" width="160" height="96" rx="4" fill="#1E40AF"/>

    <!-- Display Content (simplified NFC-e icon) -->
    <text x="128" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#60A5FA" text-anchor="middle">POS</text>

    <!-- Base/Stand -->
    <rect x="96" y="168" width="64" height="12" rx="4" fill="#ffffff"/>
    <path d="M 80 180 L 176 180 L 168 220 L 88 220 Z" fill="#ffffff"/>

    <!-- NFC-e indicator -->
    <circle cx="220" cy="40" r="24" fill="#10B981"/>
    <text x="220" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">NF</text>
  </g>

  <!-- Decorative corner accent -->
  <circle cx="448" cy="64" r="16" fill="#60A5FA" opacity="0.6"/>
  <circle cx="64" cy="448" r="16" fill="#60A5FA" opacity="0.6"/>
</svg>
